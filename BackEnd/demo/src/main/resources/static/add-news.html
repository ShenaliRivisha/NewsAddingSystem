<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News Portal - Add News</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f5f5; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 250px; background: #6a1b9a; color: white; height: 100vh; padding-top: 20px; position: fixed; top: 0; left: 0; overflow-y: auto; transition: width 0.3s; }
    .sidebar.collapsed { width: 70px; }
    .toggle-btn { display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; margin-bottom: 20px; color: white; }
    .user-info { text-align: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.2); transition: opacity 0.3s; }
    .menu-section { margin-top: 20px; padding: 0 15px; }
    .menu-item { display: flex; align-items: center; padding: 12px; text-decoration: none; color: white; border-radius: 6px; transition: background 0.3s; cursor: pointer; font-size: 16px; }
    .menu-item i { width: 25px; text-align: center; margin-right: 10px; }
    .menu-item:hover { background: #8e24aa; }
    .content-wrapper { margin-left: 250px; flex: 1; display: flex; flex-direction: column; height: 100vh; transition: margin-left 0.3s; }
    .header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
    #addNewsBtn { padding: 12px 24px; background-color: #6a1b9a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; display: flex; align-items: center; }
    #addNewsBtn:hover { background-color: #8e24aa; }
    .content { flex: 1; padding: 20px; overflow-y: auto; }
    .footer { background: #fff; padding: 10px 20px; text-align: center; font-size: 13px; color: #666; border-top: 1px solid #ddd; }
    form { background: white; padding: 25px; border-radius: 10px; box-shadow: 0px 2px 8px rgba(0,0,0,0.2); max-width: 700px; margin: auto; }
    label { display: block; margin-top: 15px; font-weight: bold; font-size: 15px; }
    input[type="text"], textarea, select, input[type="date"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
    textarea { height: 150px; resize: vertical; }
    .radio-group { margin-top: 10px; }
    .form-actions { margin-top: 25px; display: flex; justify-content: space-between; }
    .form-actions button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
    .save-btn { background-color: rgb(166, 0, 255); color: white; }
    .save-btn:hover { background-color: rgb(131, 4, 243); }
    .edit-btn, .delete-btn { background-color: #9119d2; color: white; }
    .edit-btn:hover, .delete-btn:hover { background-color: #7b14b8; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="toggle-btn"><i class="fas fa-bars"></i></div>
    <div class="user-info"><p id="displayEmail">user@email.com</p></div>
    <div class="menu-section">
      <h4>General</h4>
      <a href="blank.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="header">
      <h1 id="welcomeMessage">Welcome</h1>
      <button id="addNewsBtn"><i class="fas fa-plus"></i> Add News</button>
    </div>

    <div class="content">
      <h2>Add News</h2>
      <form id="newsForm">
        <input type="hidden" id="newsId">

        <label for="title">News Title</label>
        <input type="text" id="title" name="title" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Loading categories...</option>
        </select>

        <label for="content">News Content</label>
        <textarea id="content" name="content" required></textarea>

        <label for="author">Author Name</label>
        <input type="text" id="author" name="author" required>

        <label for="dateAdded">Date Added</label>
        <input type="date" id="dateAdded" name="dateAdded" required>

        <label for="publishDate">Publish Date</label>
        <input type="date" id="publishDate" name="publishDate" required>

        <label>Status</label>
        <div class="radio-group">
          <label><input type="radio" name="status" value="Published" required> Active</label>
          <label><input type="radio" name="status" value="Inactive"> Inactive</label>
        </div>

        <div class="form-actions">
          <button type="button" class="save-btn" onclick="saveNews()">Save</button>
          <button type="button" class="edit-btn" onclick="editNews()">Edit</button>
          <button type="button" class="delete-btn" onclick="deleteNews()">Delete</button>
        </div>
      </form>
    </div>

    <div class="footer">&copy; 2025 News Portal. All rights reserved.</div>
  </div>

  <script>
    const email = localStorage.getItem("email") || "guest@example.com";
    document.getElementById("displayEmail").innerText = email;
    document.getElementById("welcomeMessage").innerText = `Hello, ${email}!`;

    // ===== Load Categories from Backend =====
    function fetchCategories() {
      fetch('http://localhost:8080/api/category')
        .then(res => res.json())
        .then(categories => {
          const select = document.getElementById("category");
          select.innerHTML = '<option value="" disabled selected>Select category</option>';
          categories.forEach(cat => {
            const option = document.createElement("option");
            option.value = cat.categoryId; // save ID
            option.text = cat.categoryName;
            select.appendChild(option);
          });
        })
        .catch(err => alert("Error fetching categories: " + err));
    }

    // ===== Save News =====
    function saveNews() {
      const id = document.getElementById("newsId").value;
      const title = document.getElementById("title").value;
      const categoryId = parseInt(document.getElementById("category").value);
      const content = document.getElementById("content").value;
      const author = document.getElementById("author").value;
      const status = document.querySelector('input[name="status"]:checked')?.value;
      const dateAdded = document.getElementById("dateAdded").value;
      const publishDate = document.getElementById("publishDate").value;

      if (!title || !categoryId || !content || !author || !status || !dateAdded || !publishDate) {
        alert("Please fill in all fields!");
        return;
      }

      const newsItem = { title, categoryId, content, author, status, dateAdded, publishDate };
      const method = id ? 'PUT' : 'POST';
      const url = id ? `http://localhost:8080/api/news/${id}` : 'http://localhost:8080/api/news';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newsItem)
      })
      .then(res => {
        if (!res.ok) throw new Error("Failed to save news");
        alert("News saved successfully!");
        document.getElementById("newsForm").reset();
        document.getElementById("newsId").value = "";
      })
      .catch(err => alert("Error saving news: " + err));
    }

    // ===== Edit News =====
    function editNews() {
      const id = prompt("Enter the ID of the news to edit:");
      if (!id) return;

      fetch(`http://localhost:8080/api/news/${id}`)
        .then(res => res.json())
        .then(news => {
          document.getElementById("newsId").value = news.newsId;
          document.getElementById("title").value = news.title;
          document.getElementById("category").value = news.categoryId;
          document.getElementById("content").value = news.content;
          document.getElementById("author").value = news.author;
          document.getElementById("dateAdded").value = news.dateAdded;
          document.getElementById("publishDate").value = news.publishDate;
          document.querySelector(`input[name="status"][value="${news.status}"]`).checked = true;
        })
        .catch(err => alert("Error fetching news: " + err));
    }

    // ===== Delete News =====
    function deleteNews() {
      const id = prompt("Enter the ID of the news to delete:");
      if (!id) return;

      fetch(`http://localhost:8080/api/news/${id}`, { method: 'DELETE' })
        .then(res => {
          if (!res.ok) throw new Error("Failed to delete news");
          alert("News deleted successfully!");
        })
        .catch(err => alert("Error deleting news: " + err));
    }

    // ===== Initialize =====
    fetchCategories();
  </script>
</body>
</html>
